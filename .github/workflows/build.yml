name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # The panel and the gateway's channel list are both generated from the CSVs.
  # If someone edits a CSV without regenerating, the committed panel silently
  # disagrees with the indicator map -- so fail the build on drift rather than
  # ship a display that does not match its own source of truth.
  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate panel from CSVs
        run: python3 tools/gen_panel.py
      - name: Fail if committed output is stale
        run: |
          if ! git diff --exit-code -- static gateway/channels.json; then
            echo "::error::static/ or gateway/channels.json is out of date."
            echo "Run 'python3 tools/gen_panel.py' and commit the result."
            exit 1
          fi

  smoke:
    # End-to-end: real Channel Access between a caproto soft IOC and the
    # gateway. Also asserts the liveness path, which is the one behaviour that
    # must never regress -- a panel that holds stale green LEDs when the IOC
    # dies is worse than a blank one.
    runs-on: ubuntu-latest
    needs: generated-in-sync
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t tsrs-web:ci -f Dockerfile .
          docker build -t tsrs-sim:ci -f Dockerfile.sim .

      - name: Start stack
        run: |
          # Static IP, not a container name: a stopped container leaves
          # Docker DNS, which kills the CA client's search thread and makes the
          # reconnect assertion below fail for the wrong reason.
          docker network create --subnet 172.28.7.0/24 ca
          docker run -d --name tsrs-sim --network ca --ip 172.28.7.2 \
            tsrs-sim:ci --chaos 0.08 --period 4
          # x86_64 runner, so exercise the production pyepics backend here.
          docker run -d --name tsrs-web --network ca -p 8080:8080 \
            -e TSRS_CA_BACKEND=pyepics \
            -e EPICS_CA_ADDR_LIST=172.28.7.2 \
            -e EPICS_CA_AUTO_ADDR_LIST=NO \
            tsrs-web:ci

      - name: Wait for steady state
        run: |
          # Wait for every channel to be connected AND carrying a value, not
          # merely for the first connection: pyepics reports connected before
          # the first monitor update, so asserting values too early is a race.
          for i in $(seq 1 90); do
            read n v t <<<"$(curl -sf localhost:8080/api/healthz \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["ca_connected"],d["ca_with_values"],d["ca_total"])' \
              2>/dev/null || echo '0 0 0')"
            echo "t+${i}s connected=$n with_values=$v total=$t"
            [ "$n" = "76" ] && [ "$v" = "76" ] && exit 0
            sleep 1
          done
          echo "::error::did not reach steady state (connected=$n with_values=$v)"
          docker logs tsrs-web; exit 1

      - name: Assert full channel set and real values
        run: |
          curl -sf localhost:8080/api/status > /tmp/s.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/s.json"))
          ch = d["channels"]
          assert d["total"] == d["connected"] == 76, (d["total"], d["connected"])
          vals = [r["value"] for r in ch.values()]
          assert all(v is not None for v in vals), "some channels have no value"
          assert any(v == 0 for v in vals) and any(v == 1 for v in vals), \
              "expected a mix of Ready/Not Ready from the simulator"
          modes = [ch["bfo:%sMode" % m]["value"] for m in ("summit", "standby", "base")]
          assert sum(modes) == 1, "exactly one Observatory Mode PV must read 1: %r" % modes
          print("ok: 76/76 connected, values present, one mode active")
          PY

      - name: Assert dead IOC is reported as disconnected
        run: |
          docker stop tsrs-sim
          for i in $(seq 1 45); do
            n=$(curl -sf localhost:8080/api/healthz \
                | python3 -c 'import json,sys;print(json.load(sys.stdin)["ca_connected"])')
            [ "$n" = "0" ] && { echo "disconnect detected at t+${i}s"; break; }
            sleep 1
          done
          [ "$n" = "0" ] || { echo "::error::stale channels still reported connected"; exit 1; }
          # The gateway itself must stay healthy: a dead IOC is not a sick
          # gateway, and restarting it would drop the panel for no reason.
          ok=$(curl -sf localhost:8080/api/healthz \
               | python3 -c 'import json,sys;print(json.load(sys.stdin)["ok"])')
          [ "$ok" = "True" ] || { echo "::error::gateway reported itself unhealthy"; exit 1; }

      - name: Assert reconnect after IOC returns
        run: |
          docker start tsrs-sim
          for i in $(seq 1 60); do
            n=$(curl -sf localhost:8080/api/healthz \
                | python3 -c 'import json,sys;print(json.load(sys.stdin)["ca_connected"])')
            v=$(curl -sf localhost:8080/api/healthz \
                | python3 -c 'import json,sys;print(json.load(sys.stdin)["ca_with_values"])')
            [ "$n" = "76" ] && [ "$v" = "76" ] && { echo "reconnected at t+${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::did not reconnect"; docker logs tsrs-web; exit 1

      - name: Gateway logs
        if: always()
        run: docker logs tsrs-web 2>&1 | tail -40

  publish:
    needs: [generated-in-sync, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # amd64 only, on purpose: pyepics ships an x86-64 libca and the
          # deployment targets are x86_64 EL9. An arm64 image would start and
          # then die on the first CA call.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ships the systemd unit + site config + CA probe as an RPM to the GHCR yum
  # repo, so a new host is `dnf install tsrs-screen` instead of a hand-pasted
  # unit file. Tag-triggered only: the RPM version IS the image tag, so building
  # one off an untagged commit would pin the unit to an image that never exists.
  # Builds and verifies on EVERY push and PR so packaging breakage surfaces
  # immediately, not at release time. Only the publish steps are tag-gated.
  # Does not need the image: the pin is a string, so the RPM builds regardless.
  rpm:
    needs: [generated-in-sync, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A tag build takes its version from the tag. Anything else is a dev
      # build and gets 0.0.0 -- it must NOT claim a real version, because the
      # version IS the image tag and would pin the unit to an image that was
      # never published.
      - name: Resolve version
        id: v
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}" ;;
            *)            V="0.0.0" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"

      # CI calls the same scripts a developer runs locally -- never a
      # reimplementation of them. If these two lines pass on a laptop, they
      # pass here, and a packaging change cannot be green in one and broken in
      # the other.
      - name: Build RPM
        run: ./packaging/build-rpm.sh "${{ steps.v.outputs.version }}"

      - name: Verify RPM
        run: ./packaging/verify-rpm.sh "${{ steps.v.outputs.version }}"

      # upload-rpm.sh is used rather than reimplementing the scratch-tag push,
      # so changes to the repo's storage model reach us for free.
      - uses: actions/checkout@v4
        if: steps.v.outputs.release == 'true'
        with:
          repository: gemini-rtsw/gemini-rtsw-repo
          path: rpmrepo
          token: ${{ secrets.RPM_REPO_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.v.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RPM_REPO_TOKEN }}

      # --tag-only: the scratch tag is the durable source of truth, and the
      # :latest rebuild is a read-modify-write on one shared tag against a
      # multi-GB image. gemini-rtsw-repo's own runner does that job.
      - name: Register the RPM
        if: steps.v.outputs.release == 'true'
        run: ./rpmrepo/upload-rpm.sh --tag-only rpmout/tsrs-screen-${{ steps.v.outputs.version }}-*.rpm

      - name: Publish :latest on the repo's runner
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RPM_REPO_TOKEN }}
        run: gh workflow run rebuild-latest -R gemini-rtsw/gemini-rtsw-repo

      - uses: actions/upload-artifact@v4
        with:
          name: tsrs-screen-rpm-${{ steps.v.outputs.version }}
          path: rpmout/tsrs-screen-${{ steps.v.outputs.version }}-*.rpm
