# Publish a release: image, RPM, git tag.
#
# Actions -> release -> Run workflow. No inputs: the version comes from
# `%global specver` in packaging/tsrs-screen.spec, so it is bumped in a commit
# and reviewed like anything else. Typing it here would be a second copy to get
# out of sync with the spec.
#
# To release: bump specver, merge, run this.
name: release

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the git tag
      packages: write        # push the image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # needs tags to reject an already-released version

      - name: Read version from the spec
        id: v
        run: |
          V=$(awk '/^%global specver/ {print $3}' packaging/tsrs-screen.spec)
          [ -n "$V" ] || { echo "::error::no specver in packaging/tsrs-screen.spec"; exit 1; }
          echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || {
            echo "::error::specver '$V' must be digits and dots. rpmbuild treats '-' as the version/release separator."; exit 1; }
          # Re-releasing a version would republish the same NVRA, which dnf does
          # not see as an upgrade -- it would look successful and change nothing
          # on the hosts. Fail here instead.
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::v$V is already released. Bump specver in packaging/tsrs-screen.spec."; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing **$V**" >> "$GITHUB_STEP_SUMMARY"

      # Same generation checks CI runs -- a release must not be the one build
      # that skipped them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if generated output is stale
        run: |
          python3 tools/gen_panel.py
          git diff --exit-code -- static gateway/channels.json

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: pyepics ships an x86-64 libca, and an arm64 image starts and
      # then dies on the first CA call.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }},${{ env.IMAGE }}:latest
          cache-from: type=gha

      # The same two scripts a developer runs locally.
      - name: Build RPM
        run: ./packaging/build-rpm.sh
      - name: Verify RPM
        run: ./packaging/verify-rpm.sh

      - uses: actions/checkout@v4
        with:
          repository: gemini-rtsw/gemini-rtsw-repo
          path: rpmrepo
          token: ${{ secrets.RPM_REPO_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RPM_REPO_TOKEN }}

      # --tag-only: the scratch tag is the durable source of truth, and the
      # :latest rebuild is a read-modify-write on one shared multi-GB image.
      # gemini-rtsw-repo's own runner does that job.
      - name: Register the RPM
        run: ./rpmrepo/upload-rpm.sh --tag-only rpmout/tsrs-screen-${{ steps.v.outputs.version }}-*.rpm

      - name: Publish :latest on the repo's runner
        env:
          GH_TOKEN: ${{ secrets.RPM_REPO_TOKEN }}
        run: gh workflow run rebuild-latest -R gemini-rtsw/gemini-rtsw-repo

      # Tagged last, so a tag always means "this shipped" rather than "this was
      # attempted". Pushed with GITHUB_TOKEN, which deliberately does not
      # re-trigger workflows.
      - name: Tag the release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "Release v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tsrs-screen-rpm-${{ steps.v.outputs.version }}
          path: rpmout/tsrs-screen-${{ steps.v.outputs.version }}-*.rpm
