# Publish a release: image, RPM, git tag.
#
# The build itself is ci.yml, called as a reusable workflow, so a release runs
# exactly the checks every commit runs. This file adds only what is specific to
# releasing: resolve the version, register the RPM, publish, tag.
#
# Publishing follows the gemini-rtsw-ci contract: build legs push per-package
# scratch tags with `upload-rpm.sh --tag-only`, then ONE job rebuilds
# rpm-repo:latest from the full tag set. We call their publish.yml for that
# rather than running sync_repo.sh ourselves -- it frees ~30-40GB of runner disk
# first, which assembling the multi-GB yum image needs.
#
# We do NOT use gemini-rtsw-ci's build_rpm.sh / submodule. That path exists for
# EPICS packages that pull build dependencies out of rpm-repo and ship an EL8/EL9
# dev image; this package is noarch with no build deps, and our verify-rpm.sh
# asserts things generic to none of that (image pin, site resolution, upgrade
# keeping /etc/sysconfig). Publishing is shared; building is not.
#
# Actions -> release -> Run workflow. No inputs: the version comes from
# `%global specver` in packaging/tsrs-screen.spec, so it is bumped in a commit
# and reviewed like anything else. Typing it here would be a second copy to get
# out of sync with the spec.
#
# Also triggered by pushing v<specver> -- from a shell, or by
# packaging/release.sh, which runs the same steps locally.
#
# To release: bump specver, merge, then either run this workflow or push the tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Guards run before anything is built, so a bad version costs seconds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tagged: ${{ steps.v.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # needs tags to reject an already-released version
      - name: Read version from the spec
        id: v
        run: |
          V=$(awk '/^%global specver/ {print $3}' packaging/tsrs-screen.spec)
          [ -n "$V" ] || { echo "::error::no specver in packaging/tsrs-screen.spec"; exit 1; }
          echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || {
            echo "::error::specver '$V' must be digits and dots. rpmbuild treats '-' as the version/release separator."; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*)
              # Triggered by a tag: it must agree with the spec, or the RPM
              # version and the tag would describe different things.
              T="${GITHUB_REF_NAME#v}"
              [ "$T" = "$V" ] || {
                echo "::error::tag v$T does not match specver $V in packaging/tsrs-screen.spec"; exit 1; }
              echo "tagged=true" >> "$GITHUB_OUTPUT" ;;
            *)
              # Re-releasing a version republishes the same NVRA, which dnf does
              # not see as an upgrade -- it would look successful and change
              # nothing on the hosts.
              if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
                echo "::error::v$V is already released. Bump specver in packaging/tsrs-screen.spec."; exit 1; fi
              echo "tagged=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing **$V**" >> "$GITHUB_STEP_SUMMARY"

  # Drift check, smoke test, image push, RPM build + verify -- all of it.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  publish:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the git tag
      packages: write        # push to the rpm-repo package (granted to this repo
                             # in gemini-rtsw-repo's package settings)
    steps:
      - uses: actions/checkout@v4

      # The exact RPM ci.yml built and verified -- not a rebuild, so what is
      # published is what passed.
      - uses: actions/download-artifact@v4
        with:
          name: tsrs-screen-rpm
          path: rpmout

      # Cloned over https with the built-in token: gemini-rtsw-ci's publish.yml
      # does the same, so a public gemini-rtsw-repo needs no extra secret.
      - uses: actions/checkout@v4
        with:
          repository: gemini-rtsw/gemini-rtsw-repo
          path: rpmrepo
          token: ${{ secrets.RPM_REPO_TOKEN || github.token }}

      # GITHUB_TOKEN, not a PAT: write to the rpm-repo package is granted to
      # this repository in the package's "Manage Actions access" settings, as
      # gemini-rtsw-ci's README requires for every repo publishing there.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --tag-only per the gemini-rtsw-ci contract: the scratch tag is the
      # durable source of truth, and publish-latest below is the single writer
      # of :latest.
      - name: Register the RPM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./rpmrepo/upload-rpm.sh --tag-only rpmout/tsrs-screen-${{ needs.version.outputs.version }}-*.rpm

  # Single writer of rpm-repo:latest, shared with every other gemini-rtsw repo.
  # Frees runner disk before assembling the multi-GB yum image.
  publish-latest:
    needs: publish
    uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main
    secrets: inherit

  # Tagged only once the RPM is actually served, so a tag means "this shipped"
  # rather than "this was attempted". GITHUB_TOKEN deliberately does not
  # re-trigger workflows, so this cannot loop.
  tag:
    needs: [version, publish-latest]
    if: needs.version.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.version.outputs.version }}" -m "Release v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
